name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load dev env vars (non-secret placeholders, see .env.example)
        run: grep -v '^#' .env.example | grep -v '^$' >> "$GITHUB_ENV"

      - name: Start Postgres, Redis, and Redpanda
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      # Workspace packages (@app/config, @app/shared) publish their types from dist/, so
      # apps/api can't typecheck or run against them until they've been built at least
      # once — build has to come before typecheck and test, not after.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Stop infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down
