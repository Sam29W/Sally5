services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkoutkit
      POSTGRES_PASSWORD: checkoutkit
      POSTGRES_DB: checkoutkit
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkoutkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Advertise localhost, not the in-network hostname "redpanda" — the app connects
      # from the host (not from inside this compose network), and after the initial
      # connect, kafkajs reconnects using whatever address the broker advertises in its
      # metadata response. Advertising the container hostname here made every
      # post-handshake request fail with ENOTFOUND outside this compose network.
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
